<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEAM - Inicio de Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h2>Herramienta Tecnológica<br><span>UEAM</span></h2>
            <p class="login-subtitle">Selecciona o ingresa con tu perfil para continuar</p>

            <div class="role-selector">
                <label><input type="radio" name="rol" value="Estudiante" checked> Estudiante</label>
                <label><input type="radio" name="rol" value="Secretaria"> Secretaría</label>
                <label><input type="radio" name="rol" value="Administrador"> Administrador</label>
            </div>

            <div id="role-note" class="role-note">
                💡 El perfil de Estudiante no requiere contraseña y sólo tiene acceso al Módulo de Diagnóstico.
            </div>

            <!-- Campos ocultos o visibles según el rol -->
            <div class="form-group" id="user-group" style="display: none;">
                <label for="username">Usuario:</label>
                <input type="text" id="username" value="Estudiante">
            </div>

            <div class="form-group" id="pass-group" style="display: none;">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingrese su clave">
            </div>

            <button type="button" id="btn-login" class="btn-login-action">Ingresar como Estudiante</button>
        </div>
    </div>

    <script src="/eel.js"></script>
    <script src="../js/auth_ui.js"></script>
</body>
</html>
